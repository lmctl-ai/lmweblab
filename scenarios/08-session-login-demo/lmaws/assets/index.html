<!doctype html><meta charset="utf-8"><title>Session login demo</title><h1>Ephemeral session login demo</h1><p>Demonstration only. No real user credentials.</p><form id="login"><input name="user" value="demo" autocomplete="off"><input name="password" type="password" autocomplete="off"><button>Login</button></form><button id="logout">Logout</button><pre id="result"></pre><script>login.onsubmit=async e=>{e.preventDefault();result.textContent=await(await fetch('/login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(login)))})).text()};logout.onclick=async()=>{result.textContent=await(await fetch('/logout',{method:'POST',body:'{}'})).text()}</script>
